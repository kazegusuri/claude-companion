openapi: 3.0.0
info:
  title: Claude Companion API
  description: |-
    Claude Companion API
    API for managing Claude agent processes and WebSocket communication
  version: 0.0.0
tags:
  - name: Agents
paths:
  /api/agents:
    get:
      operationId: Agents_list
      description: Get list of all active agents
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
      tags:
        - Agents
  /api/agents/{id}:
    get:
      operationId: Agents_read
      description: Get a specific agent by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Agents
components:
  schemas:
    Agent:
      type: object
      required:
        - id
        - pid
        - sessionId
        - projectDir
        - projectName
        - agentType
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique identifier (UUID) for the agent
        pid:
          type: integer
          format: int32
          description: Process ID of the agent
        sessionId:
          type: string
          description: Session ID of the Claude session
        projectDir:
          type: string
          description: Project directory path
        projectName:
          type: string
          description: Project name (extracted from projectDir)
        agentType:
          type: string
          description: Type of the agent (e.g., "Claude Code")
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the agent was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the agent was last updated
        session:
          allOf:
            - $ref: '#/components/schemas/Session'
          description: Session details
      description: Agent information representing a Claude agent process
    AgentListResponse:
      type: object
      required:
        - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
          description: List of active agents
      description: Response containing a list of agents
    BackgroundTaskInfo:
      type: object
      required:
        - backgroundTaskId
        - toolUseId
        - command
        - description
        - isTerminated
        - createdAt
      properties:
        backgroundTaskId:
          type: string
          description: Background task ID
        toolUseId:
          type: string
          description: Tool use ID associated with this task
        command:
          type: string
          description: Command being executed
        description:
          type: string
          description: Description of the task
        isTerminated:
          type: boolean
          description: Whether the task has been terminated
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the task was created
        terminatedAt:
          type: string
          format: date-time
          description: Timestamp when the task was terminated
      description: Background task information
    ChatMessage:
      type: object
      required:
        - id
        - type
        - role
        - text
        - priority
        - timestamp
      properties:
        id:
          type: string
          description: Unique message ID
        type:
          allOf:
            - $ref: '#/components/schemas/MessageType'
          description: Type of the message
        role:
          type: string
          enum:
            - user
            - assistant
            - system
          description: Role of the message sender
        subType:
          type: string
          enum:
            - audio
            - text
          description: Sub-type for assistant messages
        text:
          type: string
          description: Text content of the message
        audioData:
          type: string
          description: Base64 encoded audio data (WAV format)
        priority:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: Priority for audio playback (higher = higher priority)
          default: 50
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the message
        metadata:
          allOf:
            - $ref: '#/components/schemas/MessageMetadata'
          description: Message metadata
        toolName:
          type: string
          description: Tool name (for tool_use messages)
        toolInput:
          type: object
          additionalProperties: {}
          description: Tool input (for tool_use messages)
        toolOutput:
          type: string
          description: Tool result output (for tool_result messages)
        error:
          type: string
          description: Error details (for error messages)
        content:
          type: string
          description: Content details (for content_block messages)
      description: Chat message sent via WebSocket
    ClientMessage:
      type: object
      required:
        - type
        - timestamp
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/MessageType'
          description: Message type
        sessionId:
          type: string
          description: Session ID for the message
        text:
          type: string
          description: Text content (for user_message)
        action:
          type: string
          enum:
            - permit
            - deny
          description: Action for confirm_response
        messageId:
          type: string
          description: Message ID for confirm_response
        state:
          allOf:
            - $ref: '#/components/schemas/WebSocketConnectionState'
          description: State for update_state
        timestamp:
          type: string
          format: date-time
          description: Timestamp
      description: Client message sent to WebSocket
    ConnectionStatus:
      type: string
      enum:
        - connecting
        - connected
        - disconnected
        - error
        - failed
      description: Connection status for WebSocket
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message
      description: Error response
    MessageMetadata:
      type: object
      required:
        - eventType
      properties:
        eventType:
          type: string
          description: Event type
        toolName:
          type: string
          description: Tool name
        speaker:
          type: integer
          format: int32
          description: Speaker number
        sampleRate:
          type: integer
          format: int32
          description: Sample rate for audio
        duration:
          type: number
          format: float
          description: Duration in seconds
        sessionId:
          type: string
          description: Session ID
        agentId:
          type: integer
          format: int32
          description: Agent ID (PID) associated with this message
        role:
          type: string
          enum:
            - user
            - assistant
            - system
          description: Role of the message
        subType:
          type: string
          enum:
            - audio
            - text
          description: Sub-type for assistant messages
      description: Message metadata
    MessageType:
      type: string
      enum:
        - user
        - assistant
        - system
        - notification
        - audio
        - text
        - ping
        - pong
        - user_message
        - confirm_response
        - update_state
        - tool_use
        - tool_result
        - content_block
        - error
      description: WebSocket message types
    Session:
      type: object
      required:
        - sessionId
        - uuid
        - cwd
        - transcriptPath
        - startTime
      properties:
        sessionId:
          type: string
          description: Session ID
        uuid:
          type: string
          description: UUID of the event that created this session
        cwd:
          type: string
          description: Current working directory
        transcriptPath:
          type: string
          description: Path to the transcript file
        startTime:
          type: string
          format: date-time
          description: Timestamp when the session started
        activeTool:
          allOf:
            - $ref: '#/components/schemas/ToolInfo'
          description: Active tool information
        backgroundTasks:
          type: array
          items:
            $ref: '#/components/schemas/BackgroundTaskInfo'
          description: Background tasks
      description: Session information
    ToolInfo:
      type: object
      required:
        - toolUseId
        - toolName
        - status
        - createdAt
        - updatedAt
        - isError
        - isRejected
        - isWaitingApproval
      properties:
        toolUseId:
          type: string
          description: Tool use ID
        toolName:
          type: string
          description: Tool name
        status:
          allOf:
            - $ref: '#/components/schemas/ToolStatus'
          description: Tool status
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the tool was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the tool was last updated
        isError:
          type: boolean
          description: Whether the tool resulted in an error
        isRejected:
          type: boolean
          description: Whether the tool was rejected
        isWaitingApproval:
          type: boolean
          description: Whether the tool is waiting for approval
      description: Tool information
    ToolStatus:
      type: string
      enum:
        - created
        - waiting_approval
        - running
        - finished
      description: Tool execution status
    WebSocketConnectionState:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - timeline
            - agent
          description: Connection mode
        agentPid:
          type: integer
          format: int32
          description: Agent PID when in agent mode
      description: WebSocket connection state
    WebSocketStatus:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/ConnectionStatus'
          description: Current connection status
        error:
          type: string
          description: Optional error message
        timestamp:
          type: string
          format: date-time
          description: Timestamp of status change
      description: WebSocket status message
servers:
  - url: http://localhost:8080
    description: Development server
    variables: {}
